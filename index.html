    <body>
    <button onclick="goToRandomPage()"> Go to Random Page</button>
    <script>
        function goToRandomPage() {
            const pages = [
                "Sun.html",
                "Mercury.html",
                "Venus.html",
                "Earth.html",
                "Moon.html",
                "Jupiter.html",
                "Saturn.html",
                "Uranus.html",
                "Neptune.html",
                "Pluto.html"
            ];

            const randomPage = pages[randomIndex];
            window.location.href = randomPage;
        }
